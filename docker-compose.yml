version: '3.8'

services:
  discovery-service:
    image: discovery-service
    build:
      context: ./discovery-service
    ports:
      - "8761:8761"
    networks:
      - microservices-network

  config-service:
    image: config-service
    build:
      context: ./config-service
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=native
    depends_on:
      - discovery-service
    networks:
      - microservices-network

  api-gateway:
    image: api-gateway
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
      - config-service
    networks:
      - microservices-network

  order-service:
    image: order-service
    build:
      context: ./order-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888
    depends_on:
      - discovery-service
      - config-service
      - kafka
      - postgres-order
    networks:
      - microservices-network

  payment-service:
    image: payment-service
    build:
      context: ./payment-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888
    depends_on:
      - discovery-service
      - config-service
      - kafka
      - postgres-payment
    networks:
      - microservices-network

  ticket-service:
    image: ticket-service
    build:
      context: ./ticket-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888
    depends_on:
      - discovery-service
      - config-service
      - kafka
      - postgres-ticket
    networks:
      - microservices-network

  kafka:
    image: confluentinc/cp-kafka:7.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "order-events:1:1,payment-events:1:1,ticket-events:1:1"
    depends_on:
      - zookeeper
    networks:
      - microservices-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - microservices-network

  postgres-order:
    image: postgres:13
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  postgres-payment:
    image: postgres:13
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  postgres-ticket:
    image: postgres:13
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres-ticket-data:/var/lib/postgresql/data
    networks:
      - microservices-network

volumes:
  postgres-order-data:
  postgres-payment-data:
  postgres-ticket-data:

networks:
  microservices-network:
    driver: bridge